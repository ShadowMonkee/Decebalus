[package]
name = "decebalus-backend"
version = "0.1.0"
edition = "2024"
default-run = "decebalus-backend"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = {version = "0.8.6", features=["ws"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.2", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# ipnetwork = "0.21.1"
ipnetwork = "0.20"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
dotenvy = "0.15"
once_cell = "1.21.3"
async-trait = "0.1.89"
ipnet = "2.11.0"
pnet_datalink = "0.35.0"
pnet_packet = "0.35.0"
pnet_transport = "0.35.0"
dns-lookup = "2.0"
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
russh = "0.60"
russh-sftp = "2.1"
tower-http = { version = "0.6", features = ["fs"] }

# ── Physical e-paper display (Raspberry Pi only) ─────────────────────────────
# Compiled only with `--features hardware`; these crates are Linux/Pi-specific so
# the default build (and CI/dev on macOS) never touches them.
embedded-graphics = { version = "0.8", optional = true }
epd-waveshare = { version = "0.6", optional = true }
linux-embedded-hal = { version = "0.4", optional = true }

# ── Native TUI war table (operator terminal client) ──────────────────────────
# Compiled only with `--features tui`; a thin REST client over the running server.
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[features]
# Enable on the Raspberry Pi to drive the Waveshare e-paper HAT:
#   cargo build --release --features hardware
hardware = ["dep:embedded-graphics", "dep:epd-waveshare", "dep:linux-embedded-hal"]
# Build the terminal war table:
#   cargo build --release --features tui --bin decebalus-tui
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "decebalus-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]